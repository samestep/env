name: Update
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - run: nix flake update 2>&1 | tee nix-flake-update.txt
      - uses: actions/upload-artifact@v7
        with:
          name: flake.lock
          path: |
            flake.lock
            nix-flake-update.txt

  nixos:
    needs: lock
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - run: nix build --print-build-logs .#nixosConfigurations.nixos.config.system.build.toplevel

  hm-nixos:
    needs: lock
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - run: nix build --print-build-logs .#homeConfigurations.sam.activationPackage

  hm-macos:
    needs: lock
    runs-on: macos-15
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - run: nix build --print-build-logs .#homeConfigurations.samueles.activationPackage

  hm-docker-x86:
    needs: lock
    runs-on: ubuntu-24.04
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - run: nix build --print-build-logs .#homeConfigurations.agent-amd64.activationPackage

  hm-docker-arm:
    needs: lock
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - run: nix build --print-build-logs .#homeConfigurations.agent-arm64.activationPackage

  hm-tart:
    needs: lock
    runs-on: macos-15
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - run: nix build --print-build-logs .#homeConfigurations.admin.activationPackage

  pr:
    needs:
      - lock
      - nixos
      - hm-nixos
      - hm-macos
      - hm-docker-x86
      - hm-docker-arm
      - hm-tart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: flake.lock
      - name: Generate pull request body
        id: body
        run: |
          {
            echo 'body<<EOF'
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```'
            cat nix-flake-update.txt
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update `flake.lock`
          branch: update
          title: Update `flake.lock`
          body: ${{ steps.body.outputs.body }}
